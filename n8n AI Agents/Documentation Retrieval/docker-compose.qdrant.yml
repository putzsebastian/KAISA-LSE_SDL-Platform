# Standalone Qdrant for the documentation-retrieval vector store.
#
# Local ingestion (host):  the ingest script talks to http://localhost:6333
#   docker compose -f docker-compose.qdrant.yml up -d
#
# To let n8n reach Qdrant, add this service to the main "n8n AI Agents/docker-compose.yml"
# (same `sdl` network) instead, and point the n8n Qdrant node at http://qdrant:6333.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4   # match ../docker-compose.yml (snapshots are version-specific)
    container_name: sdl-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
